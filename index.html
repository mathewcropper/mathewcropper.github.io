<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mathew Cropper</title>
<meta name="description" content="Mathew Cropper, product leader and coach, based in Cumbria, UK.">
<link rel="canonical" href="https://www.mathewcropper.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Inter:wght@400&amp;family=Space+Mono:wght@400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>
</head>
<body>
<div class="sky" id="sky">
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="zone" id="zone">
    <button type="button" class="star" style="--x:13%;--y:22%;--mx:12%;--my:7%;--d:0s" aria-expanded="false" data-name="Accenture" data-title="Manager" data-dates="Oct 2007 – Nov 2013" data-logo="images/logos/accenture.png" aria-label="Accenture: Manager, Oct 2007 – Nov 2013"><img src="images/stars/accenture.png" alt=""></button>
    <button type="button" class="star" style="--x:24%;--y:74%;--mx:30%;--my:85%;--d:.55s" aria-expanded="false" data-name="ThoughtWorks" data-title="Business Analyst" data-dates="Nov 2013 – May 2014" data-logo="images/logos/thoughtworks.png" aria-label="ThoughtWorks: Business Analyst, Nov 2013 – May 2014"><img src="images/stars/thoughtworks.png" alt=""></button>
    <button type="button" class="star" style="--x:8%;--y:52%;--mx:86%;--my:9%;--d:1.1s" aria-expanded="false" data-name="King" data-title="Director, Service Improvement" data-dates="Jun 2014 – Oct 2015" data-logo="images/logos/king.png" aria-label="King: Director, Service Improvement, Jun 2014 – Oct 2015"><img src="images/stars/king.png" alt=""></button>
    <button type="button" class="star" style="--x:31%;--y:13%;--mx:22%;--my:21%;--d:1.65s" aria-expanded="false" data-name="Zendesk" data-title="Product Manager, Mobile" data-dates="Oct 2015 – Sep 2017" data-logo="images/logos/zendesk.png" aria-label="Zendesk: Product Manager, Mobile, Oct 2015 – Sep 2017"><img src="images/stars/zendesk.png" alt=""></button>
    <button type="button" class="star" style="--x:70%;--y:19%;--mx:48%;--my:13%;--d:2.2s" aria-expanded="false" data-name="NewsWhip" data-title="Product Manager" data-dates="Oct 2017 – May 2019" data-logo="images/logos/newswhip.png" aria-label="NewsWhip: Product Manager, Oct 2017 – May 2019"><img src="images/stars/newswhip.png" alt=""></button>
    <button type="button" class="star" style="--x:87%;--y:41%;--mx:72%;--my:22%;--d:2.75s" aria-expanded="false" data-name="Intercom" data-title="Group Product Manager, Messenger" data-dates="May 2019 – Dec 2022" data-logo="images/logos/intercom.svg" aria-label="Intercom: Group Product Manager, Messenger, May 2019 – Dec 2022"><img src="images/stars/intercom.svg" alt=""></button>
    <button type="button" class="star" style="--x:77%;--y:79%;--mx:12%;--my:93%;--d:3.3s" aria-expanded="false" data-name="SoSafe" data-title="Director, Product Management" data-dates="Feb 2023 – Dec 2024" data-logo="images/logos/sosafe.png" aria-label="SoSafe: Director, Product Management, Feb 2023 – Dec 2024"><img src="images/stars/sosafe.png" alt=""></button>
    <button type="button" class="star" style="--x:91%;--y:12%;--mx:86%;--my:81%;--d:3.85s" aria-expanded="false" data-name="Markt-Pilot" data-title="Director, Product" data-dates="Oct 2024 – Dec 2025" data-logo="images/logos/markt-pilot.png" aria-label="Markt-Pilot: Director, Product, Oct 2024 – Dec 2025"><img src="images/stars/markt-pilot.png" alt=""></button>
    <button type="button" class="star" style="--x:63%;--y:88%;--mx:60%;--my:93%;--d:4.4s" aria-expanded="false" data-name="&amp;Open" data-title="Head of Product" data-dates="Jan 2026 – now" data-logo="images/logos/andopen.png" aria-label="&amp;Open: Head of Product, Jan 2026 – now"><img src="images/stars/andopen.png" alt=""></button>
  </div>
</div>
<main class="card">
  <span class="card-slot" aria-hidden="true"></span>
  <div class="card-front arrive">
    <img class="card-photo" src="images/crew-id.jpg" width="104" height="104" alt="Portrait of Mat">
    <h1 class="card-name">Mathew Cropper</h1>
    <span>Product leader and coach</span>
    <span class="card-port">Cumbria, UK</span>
    <a class="card-link" href="https://www.linkedin.com/in/mathewcropper/" target="_blank" rel="noopener"><span>LinkedIn</span><span aria-hidden="true">↗</span></a>
  </div>
</main>
<div class="tip" id="tip" role="tooltip" hidden>
  <div class="tip-logo"><img id="tip-logo" alt=""></div>
  <div class="tip-text">
    <span class="tip-name" id="tip-name"></span>
    <span class="tip-title" id="tip-title"></span>
    <span class="tip-dates" id="tip-dates"></span>
  </div>
</div>
</body>
</html>
